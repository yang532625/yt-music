name: Publish YT Music

on:
  push:
    branches:
      - main
    paths:
      - "app/build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    if: "!contains(github.ref, 'refs/tags')"
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check_version.outputs.version_changed }}
      new_version: ${{ steps.check_version.outputs.new_version }}
      version_code: ${{ steps.check_version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if version changed
        id: check_version
        run: |
          NEW_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "")
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts || echo "")
          echo "Current version: $NEW_VERSION (code: $VERSION_CODE)"

          if [ -z "$NEW_VERSION" ]; then
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git show HEAD^:app/build.gradle.kts > /dev/null 2>&1; then
            OLD_VERSION=$(git show HEAD^:app/build.gradle.kts | grep -oP 'versionName\s*=\s*"\K[^"]+' || echo "")
            if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
              echo "version_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "version_changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          fi

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

  build:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/yt-music-debug.keystore"
            echo "METROLIST_DEBUG_KEYSTORE_PATH=$HOME/yt-music-debug.keystore" >> "$GITHUB_ENV"
          else
            echo "No ANDROID_DEBUG_KEYSTORE_BASE64 secret; Gradle will use a generated debug keystore."
          fi

      - name: Build FOSS debug APK
        run: ./gradlew --console=plain assembleFossDebug
        env:
          METROLIST_APPLICATION_ID: com.yang.ytmusic
          METROLIST_APP_NAME: YT Music

      - name: Rename APK
        run: |
          mkdir -p release_files
          SRC=$(find app/build/outputs/apk/foss/debug -name "*.apk" | head -1)
          cp "$SRC" "release_files/YT-Music.apk"
          ls -la release_files/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Music
          path: release_files/YT-Music.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check-version.outputs.new_version }}"
          NOTES="YT Music ${VERSION}

          Installing this APK over the existing app keeps settings, login, and library."
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" release_files/YT-Music.apk --clobber
          else
            gh release create "v${VERSION}" \
              --title "${VERSION}" \
              --notes "$NOTES" \
              --latest \
              release_files/YT-Music.apk
          fi
